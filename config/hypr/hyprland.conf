exec-once = ghostty
$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu


# Applications
bind = SUPER, F, exec, firefox
bind = SUPER, S, exec, steam
bind = SUPER, M, exec, flatpak run com.spotify.Client

# SteamOS-style Console Mode
bind = SUPER, DELETE, exec, ~/.local/bin/desktop-to-console

# Boot to Windows
bind = SUPER, TAB, exec, sudo -n /usr/local/sbin/reboot-to-windows
bind = SUPER, END, exec, loginctl terminate-user $USER

# Sound Control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Custimization

decoration {
    rounding = 12
    rounding_power = 2

    active_opacity = 0.9
    inactive_opacity = 0.7

blur {
        enabled = true
        size = 3
        passes = 2
    }
}

general {
    border_size = 3

    col.active_border = rgb(6B7280) rgb(3B4A63) 45deg
    col.inactive_border = rgb(374151)
}
