

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

#autogenerated = 1
exec-once = ghostty
$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu


# Applications
bind = SUPER, F, exec, firefox
bind = SUPER, S, exec, steam
bind = SUPER, M, exec, flatpak run com.spotify.Client

# SteamOS-style Console Mode
bind = SUPER, DELETE, exec, ~/.local/bin/desktop-to-console

# Boot to Windows
bind = SUPER, TAB, exec, sudo -n /usr/local/sbin/reboot-to-windows

# Sound Control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
