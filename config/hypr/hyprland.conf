

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

#autogenerated = 1
exec-once = hyprpaper
exec-once = ghostty
$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
#bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu


# Applications
bind = SUPER, F, exec, firefox
bind = SUPER, S, exec, steam
bind = SUPER, M, exec, flatpak run com.spotify.Client
bind = SUPER, W, exec, quickshell ipc call wallpaper toggle
# SteamOS-style Console Mode
bind = SUPER, DELETE, exec, ~/.local/bin/desktop-to-console

# Boot to Windows
bind = SUPER, TAB, exec, sudo -n /usr/local/sbin/reboot-to-windows
bind = SUPER, END, exec, loginctl terminate-user $USER

# Sound Control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Move focused window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Move and resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Custimization

decoration {
    rounding = 12
    rounding_power = 2

    active_opacity = 0.9
    inactive_opacity = 0.7

blur {
        enabled = true
        size = 3
        passes = 2
    }
}

general {
    border_size = 3

    col.active_border = rgb(6B7280) rgb(3B4A63) 45deg
    col.inactive_border = rgb(374151)
}
exec-once = quickshell --no-duplicate
